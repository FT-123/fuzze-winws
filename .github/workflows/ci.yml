name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Compile
        run: python -m py_compile main.py config.py version.py user_lists.py fuzzer_engine.py diagnostics.py search_planner.py strategy_model.py models.py presets.py updater.py ui/app.py ui/components.py ui/dialogs.py ui/tray.py ui/theme.py

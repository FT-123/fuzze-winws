name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без v, например 1.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Checkout Flowseal engine
        uses: actions/checkout@v4
        with:
          repository: Flowseal/zapret-discord-youtube
          ref: "1.9.6"
          path: build/upstream/flowseal
          persist-credentials: false

      - name: Download zapret2 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/upstream | Out-Null
          Invoke-WebRequest -Uri "https://github.com/bol-van/zapret2/releases/download/v1.0.4/zapret2-v1.0.4.zip" -OutFile "build/upstream/zapret2-v1.0.4.zip"
          Expand-Archive -Path "build/upstream/zapret2-v1.0.4.zip" -DestinationPath "build/upstream/zapret2-release" -Force

      - name: Prepare engine
        run: |
          python scripts/prepare_engine.py `
            --flowseal-dir build/upstream/flowseal `
            --zapret2-dir build/upstream/zapret2-release

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}"
            if ($version -like "v*") { $version = $version.Substring(1) }
          }
          if (-not $version) { throw "Версия не определена" }
          python scripts/set_version.py $version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          }
          if (-not $iscc) { throw "ISCC.exe не найден" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        run: python scripts/build_installer.py --version $env:VERSION

      - name: Checksums
        run: python scripts/make_checksums.py $env:VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ env.VERSION }}
          path: |
            dist/installer/ZapretStrategyTuner-Setup-${{ env.VERSION }}.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Zapret Strategy Tuner ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/installer/ZapretStrategyTuner-Setup-${{ env.VERSION }}.exe
            dist/installer/SHA256SUMS.txt
